name: RAI-112 release trust exercise

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rai112-release-exercise.yml'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Create one-time RAI-112 prerelease
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-rai112.1
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Prerelease $RELEASE_TAG already exists; exercise is intentionally one-shot."
            exit 0
          fi
          gh release create "$RELEASE_TAG"             --target "$GITHUB_SHA"             --prerelease             --title "RAI-112 trust-package exercise $RELEASE_TAG"             --notes "Non-production prerelease created solely to execute and verify the consolidated RAI-112 release trust package."             --repo "$GITHUB_REPOSITORY"
          echo "created=true" >> "$GITHUB_OUTPUT"

  exercise-trust-package:
    needs: create-prerelease
    if: needs.create-prerelease.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-trust.yml
    with:
      release_tag: v0.1.0-rai112.1
