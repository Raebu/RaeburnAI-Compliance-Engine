name: Generate dependency lockfile

on:
  push:
    branches: [feat/supply-chain-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Stop when lockfile is already committed
        id: existing
        run: |
          if test -f pnpm-lock.yaml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Activate pinned pnpm
        if: steps.existing.outputs.present != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          pnpm --version
      - name: Generate lockfile from workspace manifests
        if: steps.existing.outputs.present != 'true'
        run: pnpm install --lockfile-only --frozen-lockfile=false
      - name: Commit generated lockfile
        if: steps.existing.outputs.present != 'true'
        run: |
          git add pnpm-lock.yaml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: commit pnpm lockfile'
          git push origin HEAD:feat/supply-chain-hardening
