name: Bootstrap Chain image digests

on:
  push:
    branches:
      - bootstrap-chain-image-digests-20260919

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve official multi-platform image digests
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "node:22.23.2-alpine3.24"
            "postgres:16-alpine"
            "redis:7-alpine"
            "qdrant/qdrant:v1.12.6"
          )
          for image in "${images[@]}"; do
            echo "IMAGE=$image"
            docker buildx imagetools inspect "$image" | sed -n '1,5p'
          done
