name: Repository SBOM

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/sbom.yml'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/requirements*.txt'
      - '**/Pipfile.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pom.xml'
      - '**/build.gradle*'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - '**/Dockerfile*'

permissions:
  contents: write
  actions: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Generate SPDX repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Generate CycloneDX repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false
