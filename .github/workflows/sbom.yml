name: Generate SBOM

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/sbom.yml'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '**/pyproject.toml'
      - '**/poetry.lock'
      - '**/requirements*.txt'
      - '**/Pipfile.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pom.xml'
      - '**/build.gradle*'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - '**/Dockerfile*'

permissions:
  contents: write
  actions: read

jobs:
  sbom:
    name: Generate supply-chain inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate SPDX 2.3 JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: true
      - name: Generate CycloneDX 1.6 JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: true
